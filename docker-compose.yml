services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      JDBC_URL: jdbc:postgresql://db:5432/disclosure
      JDBC_USER: disclosure
      JDBC_PASSWORD: disclosure
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: disclosure
      POSTGRES_PASSWORD: disclosure
      POSTGRES_DB: disclosure
